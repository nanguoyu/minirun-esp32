name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash tools/setup.sh
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: cmake -S . -B build -DMINIRUN_SANITIZE=ON && cmake --build build --parallel 4 && ctest --test-dir build --output-on-failure
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        run: |
          . /opt/esp/idf/export.sh
          bash tools/build_firmware.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp32-s3-eye-firmware
          path: |
            firmware/build/esp32_minirun.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
